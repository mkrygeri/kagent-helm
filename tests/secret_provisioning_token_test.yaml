suite: Secret provisioning token tests
templates:
  - secret-provisioning-token.yaml
set:
  kagent.companyId: "12345"
  kagent.provisioningToken: "test-token"

tests:
  - it: should render a Secret with correct name
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kagent-provisioning-token

  - it: should have type Opaque
    asserts:
      - equal:
          path: type
          value: Opaque

  - it: should contain base64-encoded token under the 'token' key
    asserts:
      - isNotNull:
          path: data.token
      - equal:
          path: data.token
          value: dGVzdC10b2tlbg==

  - it: should fail when provisioningToken is empty
    set:
      kagent.provisioningToken: ""
    asserts:
      - failedTemplate: {}
