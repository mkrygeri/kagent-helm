{{- if or .Values.service.enabled .Values.service.healthService.enabled }}
{{- include "kagent.validate" . }}
{{- end }}
{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kagent.fullname" . }}
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and .Values.service.externalTrafficPolicy (or (eq .Values.service.type "LoadBalancer") (eq .Values.service.type "NodePort")) }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "kagent.selectorLabels" . | nindent 4 }}
  ports:
    {{- toYaml .Values.service.ports | nindent 4 }}
{{- end }}
{{- if eq .Values.deploymentType "statefulset" }}
---
# Headless service required by the StatefulSet as its governing service.
# Enables stable DNS entries (<pod>.<svc>.<namespace>.svc.cluster.local) for peer discovery.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kagent.fullname" . }}-headless
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "kagent.selectorLabels" . | nindent 4 }}
  ports:
    {{- toYaml .Values.service.ports | nindent 4 }}
{{- end }}
{{- if .Values.service.healthService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kagent.fullname" . }}-health
  labels:
    {{- include "kagent.labels" . | nindent 4 }}
    {{- with .Values.service.healthService.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.healthService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.healthService.type }}
  {{- if and .Values.service.healthService.externalTrafficPolicy (or (eq .Values.service.healthService.type "LoadBalancer") (eq .Values.service.healthService.type "NodePort")) }}
  externalTrafficPolicy: {{ .Values.service.healthService.externalTrafficPolicy }}
  {{- end }}
  {{- with .Values.service.healthService.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  {{- with .Values.service.healthService.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "kagent.selectorLabels" . | nindent 4 }}
  ports:
    {{- toYaml .Values.service.healthService.ports | nindent 4 }}
{{- end }}
